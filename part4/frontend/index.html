<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBNB - Available Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html"><img src="images/logo.png" alt="HBnB logo" class="logo"></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" class="login-button" id="login-link">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Available Places</h1>
        
        <section class="filter-section">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter" class="price-filter">
                <option value="10">$10</option>
                <option value="50">$50</option>
                <option value="100">$100</option>
                <option value="all">All</option>
            </select>
        </section>

        <section id="places-list">
            <div id="places-container" class="places-container">
            </div>
        </section>
    </main>

    <footer>
        <p>All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
